# Polled by Jenkins (tools/gh-wait.sh). The PowerPC setup is based on
# schismtracker's .github/workflows/osx.yml.
name: macos

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # job names must match the Jenkinsfile
    name: macos-${{ matrix.arch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64, ppc]
    steps:
      - uses: actions/checkout@v4

      # CPATH, not --cflags: the Makefile doesn't pass CFLAGS to the examples
      - name: Install Vulkan
        if: matrix.arch != 'ppc'
        run: |
          brew install molten-vk vulkan-loader vulkan-headers
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"

      - name: Cache x86_64 files
        if: matrix.arch == 'x86_64'
        id: cache-x86_64
        uses: actions/cache@v4
        with:
          path: /Users/runner/x86_64
          key: mac-x86_64-files

      - name: Download 10.11 SDK for x86_64
        if: matrix.arch == 'x86_64' && steps.cache-x86_64.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/x86_64/SDKs"
          curl -fL "https://github.com/alexey-lysiuk/macos-sdk/releases/download/10.11/MacOSX10.11.tar.bz2" | tar -xf - -C "$HOME/x86_64/SDKs"

      - name: Cache PowerPC files
        if: matrix.arch == 'ppc'
        id: cache-ppc
        uses: actions/cache@v4
        with:
          path: /Users/runner/ppc
          key: mac-powerpc-files

      # third-party binaries, so the hash is pinned
      - name: Download PowerPC cross compile binaries
        if: matrix.arch == 'ppc' && steps.cache-ppc.outputs.cache-hit != 'true'
        run: |
          curl -fL -o macppc-bins.zip "https://www.dropbox.com/scl/fi/trq99fq51p13nh8tajpwa/schism-macppc-bins.zip?rlkey=xemvhpmm1ci0dnseawmanr749&st=c7jlwru4&dl=1"
          echo "a8100054f40bb5d50742538494b18b613c7d5dcb0a2b2485df9c31309ee7cee7  macppc-bins.zip" | shasum -a 256 -c -
          unzip -q macppc-bins.zip -d "$RUNNER_TEMP/macppc-bins"
          rm macppc-bins.zip
          mkdir -p "$HOME/ppc/SDKs"
          for i in Xcode3as Xcode3gcc42 Xcode3ld OSX108INT; do
            tar -xf "$RUNNER_TEMP/macppc-bins/$i.tar.gz" -C "$HOME/ppc"
          done
          curl -fL "https://github.com/alexey-lysiuk/macos-sdk/releases/download/10.4u/MacOSX10.4u.tar.bz2" | tar -xf - -C "$HOME/ppc/SDKs"
          curl -fL "https://github.com/alexey-lysiuk/macos-sdk/releases/download/10.5/MacOSX10.5.tar.bz2" | tar -xf - -C "$HOME/ppc/SDKs"

      # current Xcode's as/ld can't do PowerPC; gcc uses these via -B
      - name: Set up PowerPC assembler and linker
        if: matrix.arch == 'ppc'
        run: |
          mkdir -p "$RUNNER_TEMP/ppc-bin"
          ln -sf "$HOME/ppc/usr/libexec/gcc/darwin/ppc/as" "$RUNNER_TEMP/ppc-bin/as"
          ln -sf "$HOME/ppc/usr/bin/ld" "$RUNNER_TEMP/ppc-bin/ld"

      # flags go in CC since it's on every compile/link line; LINK goes in via
      # LIBDIR, which is empty on Darwin and only used when linking
      - name: Set up toolchain
        run: |
          case "${{ matrix.arch }}" in
          arm64)
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CONFIGURE_FLAGS=--enable-opengl --enable-vulkan --without-vulkan-string-helper" >> "$GITHUB_ENV"
            ;;
          x86_64)
            sdk="$HOME/x86_64/SDKs/MacOSX10.11.sdk"
            echo "CC=clang -arch x86_64 -isysroot $sdk -mmacosx-version-min=10.7" >> "$GITHUB_ENV"
            echo "CONFIGURE_FLAGS=--enable-opengl --enable-vulkan --without-vulkan-string-helper" >> "$GITHUB_ENV"
            ;;
          ppc)
            sdk="$HOME/ppc/SDKs/MacOSX10.4u.sdk"
            libgcc="$HOME/ppc/SDKs/MacOSX10.5.sdk/usr/lib/gcc/powerpc-apple-darwin10/4.2.1/libgcc.a"
            echo "EXTRA_PATH=$HOME/ppc/usr/bin" >> "$GITHUB_ENV"
            echo "CC=powerpc-apple-darwin10-gcc-4.2.1 -B$RUNNER_TEMP/ppc-bin/ -isysroot $sdk -mmacosx-version-min=10.4 -I$sdk/usr/include/gcc/darwin/3.3 -mcpu=G3" >> "$GITHUB_ENV"
            echo "LINK=-F$sdk/System/Library/Frameworks -L/usr/lib -L/usr/lib/system -Wl,-syslibroot,$sdk -static-libgcc $libgcc" >> "$GITHUB_ENV"
            # no static lib: no ppc-capable ar
            echo "CONFIGURE_FLAGS=--enable-opengl --disable-static" >> "$GITHUB_ENV"
            ;;
          esac

      - name: Configure
        run: |
          [ -n "$EXTRA_PATH" ] && export PATH="$PATH:$EXTRA_PATH"
          ./configure $CONFIGURE_FLAGS

      - name: Build
        run: |
          [ -n "$EXTRA_PATH" ] && export PATH="$PATH:$EXTRA_PATH"
          make -j"$(sysctl -n hw.ncpu)" LIBDIR="$LINK"

      - name: Rename
        run: mv src/libMw.dylib "libMwMac-${{ matrix.arch }}.dylib"

      - uses: actions/upload-artifact@v4
        with:
          name: milsko-macos-${{ matrix.arch }}
          path: libMwMac-*.dylib
          if-no-files-found: error
          retention-days: 7

  classic:
    name: classicmac-ppc
    runs-on: ubuntu-latest
    container: ghcr.io/autc04/retro68
    env:
      RETRO68: /Retro68-build/toolchain
      INTERFACES_COMMIT: 17fc24355e97167b977f32ea64982a06f3245e48
    steps:
      - uses: actions/checkout@v4

      # the image's multiversal headers lack ATSUnicode.h, Folders.h, etc.
      - name: Install Universal Interfaces
        run: |
          il="$RUNNER_TEMP/InterfacesAndLibraries"
          git init -q "$il"
          git -C "$il" fetch -q --depth 1 https://github.com/PowerMacTools/InterfacesAndLibraries "$INTERFACES_COMMIT"
          git -C "$il" checkout -q FETCH_HEAD
          # Retro68 wants resource forks at .rsrc/X, not X.rsrc
          find "$il" -path "$il/.git" -prune -o -type f -name '*.rsrc' -print | while IFS= read -r f; do
            d=$(dirname "$f")
            mkdir -p "$d/.rsrc"
            mv "$f" "$d/.rsrc/$(basename "$f" .rsrc)"
          done
          /Retro68-build/bin/interfaces-and-libraries.sh "$RETRO68" "$il"

      - name: Configure
        run: cmake -B build-ppc -DPLATFORM=retroppc -DMW_BUILD_EXAMPLES=ON -DCMAKE_TOOLCHAIN_FILE="$RETRO68/powerpc-apple-macos/cmake/retroppc.toolchain.cmake"

      - name: Build
        run: cmake --build build-ppc -j"$(nproc)"

      - name: Pack examples
        run: |
          if ! command -v hformat >/dev/null; then
            apt-get update && apt-get install -y hfsutils
          fi
          ./tools/retro68-pack.sh build-ppc milsko-examples-classicmac-ppc.dsk
          mv build-ppc/libMw.a libMwClassicMac-ppc.a

      - uses: actions/upload-artifact@v4
        with:
          name: milsko-classicmac-ppc
          path: |
            libMwClassicMac-ppc.a
            milsko-examples-classicmac-ppc.dsk
          if-no-files-found: error
          retention-days: 7
