# Mac OS X builds run on GitHub's runners (via the github.com/pyrite-dev/milsko
# mirror). Jenkins does not receive anything from here; it polls this workflow
# with tools/gh-wait.sh and archives the artifacts itself.
#
# Everything builds on one Apple Silicon runner: arm64 natively, x86_64 and
# PowerPC by cross compiling. The PowerPC setup follows schismtracker's
# workflow (.github/workflows/osx.yml there): Xcode 3's powerpc gcc 4.2.1,
# which is an x86_64 binary run under Rosetta, against the 10.4u SDK.
#
# Per-architecture files (SDKs, toolchains) live in $HOME/<arch>, so they
# stay out of the checkout and can be cached.
name: macos

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macos-14 because that's what the PowerPC hack is known to work on.
    runs-on: macos-14
    strategy:
      # let every arch finish, so one failing doesn't hide the others' results
      fail-fast: false
      matrix:
        arch: [arm64, x86_64, ppc]
    steps:
      - uses: actions/checkout@v4

      # MoltenVK is the Vulkan driver on macOS. The library dlopen()s
      # libvulkan.dylib at runtime (from vulkan-loader), so building only
      # needs the headers, which are the same for arm64 and x86_64.
      # Homebrew's include dir isn't on Apple clang's default search path.
      # Use CPATH rather than --cflags: the generated Makefile only passes
      # CFLAGS to library objects, not to the examples (e.g. vkdemos/vulkan).
      - name: Install Vulkan
        if: matrix.arch != 'ppc'
        run: |
          brew install molten-vk vulkan-loader vulkan-headers
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"

      - name: Cache x86_64 files
        if: matrix.arch == 'x86_64'
        id: cache-x86_64
        uses: actions/cache@v4
        with:
          path: /Users/runner/x86_64
          key: mac-x86_64-files

      - name: Download 10.11 SDK for x86_64
        if: matrix.arch == 'x86_64' && steps.cache-x86_64.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/x86_64/SDKs"
          curl -fL "https://github.com/alexey-lysiuk/macos-sdk/releases/download/10.11/MacOSX10.11.tar.bz2" | tar -xf - -C "$HOME/x86_64/SDKs"

      - name: Cache PowerPC files
        if: matrix.arch == 'ppc'
        id: cache-ppc
        uses: actions/cache@v4
        with:
          path: /Users/runner/ppc
          key: mac-powerpc-files

      # Same zip schismtracker uses. It's third-party binaries from a Dropbox
      # link, so pin its hash: if it ever changes, this fails instead of
      # running something different.
      - name: Download PowerPC cross compile binaries
        if: matrix.arch == 'ppc' && steps.cache-ppc.outputs.cache-hit != 'true'
        run: |
          curl -fL -o macppc-bins.zip "https://www.dropbox.com/scl/fi/trq99fq51p13nh8tajpwa/schism-macppc-bins.zip?rlkey=xemvhpmm1ci0dnseawmanr749&st=c7jlwru4&dl=1"
          echo "a8100054f40bb5d50742538494b18b613c7d5dcb0a2b2485df9c31309ee7cee7  macppc-bins.zip" | shasum -a 256 -c -
          unzip -q macppc-bins.zip -d "$RUNNER_TEMP/macppc-bins"
          rm macppc-bins.zip
          mkdir -p "$HOME/ppc/SDKs"
          for i in Xcode3as Xcode3gcc42 Xcode3ld OSX108INT; do
            tar -xf "$RUNNER_TEMP/macppc-bins/$i.tar.gz" -C "$HOME/ppc"
          done
          curl -fL "https://github.com/alexey-lysiuk/macos-sdk/releases/download/10.4u/MacOSX10.4u.tar.bz2" | tar -xf - -C "$HOME/ppc/SDKs"
          curl -fL "https://github.com/alexey-lysiuk/macos-sdk/releases/download/10.5/MacOSX10.5.tar.bz2" | tar -xf - -C "$HOME/ppc/SDKs"

      # The current Xcode has no PowerPC assembler; gcc 4.2.1 looks for it here.
      - name: Install PowerPC assembler into Xcode
        if: matrix.arch == 'ppc'
        run: |
          as_dir="$(xcode-select --print-path)/Toolchains/XcodeDefault.xctoolchain/usr/libexec/as/ppc"
          mkdir -p "$as_dir"
          cp "$HOME/ppc/usr/libexec/gcc/darwin/ppc/as" "$as_dir/as"

      # CC carries the arch/SDK flags, since it's the only thing the generated
      # Makefile uses on every compile and link line (library and examples).
      # LINK goes in through LIBDIR, which on Darwin is otherwise empty and
      # only appears on link lines.
      - name: Set up toolchain
        run: |
          case "${{ matrix.arch }}" in
          arm64)
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CONFIGURE_FLAGS=--enable-opengl --enable-vulkan --without-vulkan-string-helper" >> "$GITHUB_ENV"
            ;;
          x86_64)
            sdk="$HOME/x86_64/SDKs/MacOSX10.11.sdk"
            echo "CC=clang -arch x86_64 -isysroot $sdk -mmacosx-version-min=10.7" >> "$GITHUB_ENV"
            echo "CONFIGURE_FLAGS=--enable-opengl --enable-vulkan --without-vulkan-string-helper" >> "$GITHUB_ENV"
            ;;
          ppc)
            sdk="$HOME/ppc/SDKs/MacOSX10.4u.sdk"
            libgcc="$HOME/ppc/SDKs/MacOSX10.5.sdk/usr/lib/gcc/powerpc-apple-darwin10/4.2.1/libgcc.a"
            echo "EXTRA_PATH=$HOME/ppc/usr/bin" >> "$GITHUB_ENV"
            echo "CC=powerpc-apple-darwin10-gcc-4.2.1 -isysroot $sdk -mmacosx-version-min=10.4 -I$sdk/usr/include/gcc/darwin/3.3 -mcpu=G3" >> "$GITHUB_ENV"
            echo "LINK=-F$sdk/System/Library/Frameworks -L/usr/lib -L/usr/lib/system -Wl,-syslibroot,$sdk -static-libgcc $libgcc" >> "$GITHUB_ENV"
            # No Vulkan on PowerPC (no MoltenVK). No static library either:
            # the toolchain has no ar, and the host's can't index ppc objects.
            echo "CONFIGURE_FLAGS=--enable-opengl --disable-static" >> "$GITHUB_ENV"
            ;;
          esac

      - name: Configure
        run: |
          # appended, not prepended, so the host's tools still come first
          [ -n "$EXTRA_PATH" ] && export PATH="$PATH:$EXTRA_PATH"
          ./configure $CONFIGURE_FLAGS

      - name: Build
        run: |
          [ -n "$EXTRA_PATH" ] && export PATH="$PATH:$EXTRA_PATH"
          make -j"$(sysctl -n hw.ncpu)" LIBDIR="$LINK"

      - name: Rename
        run: mv src/libMw.dylib "libMwMac-${{ matrix.arch }}.dylib"

      # artifact names must be unique per run; Jenkins fetches milsko-macos-*
      - uses: actions/upload-artifact@v4
        with:
          name: milsko-macos-${{ matrix.arch }}
          path: libMwMac-*.dylib
          if-no-files-found: error
          retention-days: 7
